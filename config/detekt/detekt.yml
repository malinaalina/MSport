# Overrides on top of Detekt's bundled default config (buildUponDefaultConfig = true in build.gradle.kts).
# Anything not mentioned here keeps Detekt's default behavior.

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

console-reports:
  active: true
  exclude:
     - 'ProjectStatisticsReport'
     - 'ComplexityReport'
     - 'NotificationReport'
     - 'FileBasedFindingsReport'

complexity:
  LongMethod:
    active: true
    threshold: 60
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 8
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    active: true
    threshold: 15
    ignoreAnnotated: ['Composable']
  NestedBlockDepth:
    active: true
    threshold: 5
  TooManyFunctions:
    active: true
    thresholdInFiles: 15
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    thresholdInObjects: 15
    thresholdInEnums: 15

coroutines:
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SuspendFunSwallowedCancellation:
    active: true
  SuspendFunWithCoroutineScopeReceiver:
    active: true

exceptions:
  SwallowedException:
    active: false
  TooGenericExceptionCaught:
    active: false

naming:
  FunctionNaming:
    active: true
    # Composables are PascalCase by convention (they read as a component name, not a verb).
    ignoreAnnotated: ['Composable']

style:
  # Extremely noisy in a Compose codebase (every .dp/.sp/padding/alpha literal would be flagged).
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 140
    excludeCommentStatements: true
  ReturnCount:
    active: true
    max: 4
  UnusedPrivateMember:
    active: true
  WildcardImport:
    active: true

formatting:
  # Only trailing-comma checks are wanted from this ruleset; every other ktlint-wrapped
  # rule here is disabled explicitly because the ruleset-level `active` flag is all-or-nothing
  # (setting it to false suppresses every rule, even ones set to active: true individually).
  AnnotationOnSeparateLine:
    active: false
  AnnotationSpacing:
    active: false
  ArgumentListWrapping:
    active: false
  BlockCommentInitialStarAlignment:
    active: false
  ChainWrapping:
    active: false
  ClassName:
    active: false
  CommentSpacing:
    active: false
  CommentWrapping:
    active: false
  ContextReceiverMapping:
    active: false
  DiscouragedCommentLocation:
    active: false
  EnumEntryNameCase:
    active: false
  EnumWrapping:
    active: false
  Filename:
    active: false
  FinalNewline:
    active: false
  FunKeywordSpacing:
    active: false
  FunctionName:
    active: false
  FunctionReturnTypeSpacing:
    active: false
  FunctionSignature:
    active: false
  FunctionStartOfBodySpacing:
    active: false
  FunctionTypeReferenceSpacing:
    active: false
  IfElseBracing:
    active: false
  IfElseWrapping:
    active: false
  ImportOrdering:
    active: false
  Indentation:
    active: false
  KdocWrapping:
    active: false
  MaximumLineLength:
    active: false
  ModifierListSpacing:
    active: false
  ModifierOrdering:
    active: false
  MultiLineIfElse:
    active: false
  MultilineExpressionWrapping:
    active: false
  NoBlankLineBeforeRbrace:
    active: false
  NoBlankLineInList:
    active: false
  NoBlankLinesInChainedMethodCalls:
    active: false
  NoConsecutiveBlankLines:
    active: false
  NoConsecutiveComments:
    active: false
  NoEmptyClassBody:
    active: false
  NoEmptyFirstLineInClassBody:
    active: false
  NoEmptyFirstLineInMethodBlock:
    active: false
  NoLineBreakAfterElse:
    active: false
  NoLineBreakBeforeAssignment:
    active: false
  NoMultipleSpaces:
    active: false
  NoSemicolons:
    active: false
  NoSingleLineBlockComment:
    active: false
  NoTrailingSpaces:
    active: false
  NoUnitReturn:
    active: false
  NoUnusedImports:
    active: false
  NoWildcardImports:
    active: false
  NullableTypeSpacing:
    active: false
  PackageName:
    active: false
  ParameterListSpacing:
    active: false
  ParameterListWrapping:
    active: false
  ParameterWrapping:
    active: false
  PropertyName:
    active: false
  PropertyWrapping:
    active: false
  SpacingAroundAngleBrackets:
    active: false
  SpacingAroundColon:
    active: false
  SpacingAroundComma:
    active: false
  SpacingAroundCurly:
    active: false
  SpacingAroundDot:
    active: false
  SpacingAroundDoubleColon:
    active: false
  SpacingAroundKeyword:
    active: false
  SpacingAroundOperators:
    active: false
  SpacingAroundParens:
    active: false
  SpacingAroundRangeOperator:
    active: false
  SpacingAroundUnaryOperator:
    active: false
  SpacingBetweenDeclarationsWithAnnotations:
    active: false
  SpacingBetweenDeclarationsWithComments:
    active: false
  SpacingBetweenFunctionNameAndOpeningParenthesis:
    active: false
  StringTemplate:
    active: false
  StringTemplateIndent:
    active: false
  TrailingCommaOnCallSite:
    active: true
    useTrailingCommaOnCallSite: true
  TrailingCommaOnDeclarationSite:
    active: true
    useTrailingCommaOnDeclarationSite: true
  TryCatchFinallySpacing:
    active: false
  TypeArgumentListSpacing:
    active: false
  TypeParameterListSpacing:
    active: false
  UnnecessaryParenthesesBeforeTrailingLambda:
    active: false
  Wrapping:
    active: false
